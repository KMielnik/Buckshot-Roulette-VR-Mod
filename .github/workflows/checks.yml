name: Release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build and test the public package
        run: |
          python tools/build.py
          python -m unittest discover -s tests -p "test_*.py"
      - name: Get the matching Godot editor
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'godot.zip'
          Invoke-WebRequest 'https://github.com/godotengine/godot/releases/download/4.1.1-stable/Godot_v4.1.1-stable_win64.exe.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'E1C418EE2CDF85745EB49BEEC2CB9437480C36DF9EE841DB9DA5D530958CE739') { throw 'Godot archive mismatch' }
          Expand-Archive $archive (Join-Path $env:RUNNER_TEMP 'godot')
      - name: Run the Godot input fixture
        shell: pwsh
        run: |
          python tests/fixture.py (Join-Path $env:RUNNER_TEMP 'godot/Godot_v4.1.1-stable_win64_console.exe')
